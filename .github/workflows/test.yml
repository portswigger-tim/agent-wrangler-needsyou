name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# Side by side, not nested: validate-manifest.mjs copies this checkout into a
# fake extensions dir and runs the loader's import scan over every file in it,
# so agent-wrangler must not live inside it.
defaults:
  run:
    working-directory: needsyou

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # npm test hands node quoted globs, which Node expands from 21 on.
        node: [22, 24]
    env:
      AW_REPO: ${{ github.workspace }}/agent-wrangler
    steps:
      - uses: actions/checkout@v4
        with:
          path: needsyou
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: PortSwigger/agent-wrangler
          ref: main
          path: agent-wrangler
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            needsyou/package-lock.json
            agent-wrangler/package-lock.json

      - run: npm ci

      # Only the loader's own imports (semver) are needed; nothing is booted.
      - run: npm ci --ignore-scripts
        working-directory: agent-wrangler

      - run: node scripts/validate-manifest.mjs

      - run: npm test

  # The same verification gate as the local hooks (.pre-commit-config.yaml), so
  # a commit made with --no-verify, or from a clone without hooks, still can't
  # reach main unchecked.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: needsyou
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: needsyou/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci --ignore-scripts

      - run: pip install pre-commit

      - run: pre-commit run --all-files --show-diff-on-failure

  # Boots agent-wrangler main with this checkout copied in as
  # extensions/needsyou, on a throwaway data dir and port, and drives it over
  # the control WS and /mcp as a board tab and an agent would. No session is
  # started and nothing is delivered to a live card. Fails on a quarantine, a
  # missing frame or tool, or any flow that does not land in graph.inbox.
  boot-smoke:
    runs-on: ubuntu-latest
    env:
      AW_REPO: ${{ github.workspace }}/agent-wrangler
    steps:
      - uses: actions/checkout@v4
        with:
          path: needsyou
          persist-credentials: false

      # Public repo over https: no token or secret is needed or passed.
      - uses: actions/checkout@v4
        with:
          repository: PortSwigger/agent-wrangler
          ref: main
          path: agent-wrangler
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            needsyou/package-lock.json
            agent-wrangler/package-lock.json

      # The copy boot-smoke installs needs this checkout's node_modules (zod).
      - run: npm ci --omit=dev --ignore-scripts

      # No install scripts: the smoke boot opens no terminal, and node-pty
      # ships a linux-x64 prebuild for the import.
      - run: npm ci --ignore-scripts
        working-directory: agent-wrangler

      - run: sudo apt-get update && sudo apt-get install -y tmux

      - run: scripts/boot-smoke.sh
