name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Side by side, not nested: validate-manifest.mjs copies this checkout into a
# fake extensions dir and runs the loader's import scan over every file in it,
# so agent-wrangler must not live inside it.
defaults:
  run:
    working-directory: needsyou

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # npm test hands node quoted globs, which Node expands from 21 on.
        node: [22, 24]
    timeout-minutes: 10
    env:
      AW_REPO: ${{ github.workspace }}/agent-wrangler
    steps:
      # First, so its pre step locks down egress before any other step runs.
      - uses: portswigger-tim/safer-runner-action@d9772c3c7c5c0f8cd6cb7123e138120b11c12371 # v2.2.1
        with:
          mode: analyze
          allowed-domains: |
            registry.npmjs.org
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: needsyou
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PortSwigger/agent-wrangler
          ref: main
          path: agent-wrangler
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            needsyou/package-lock.json
            agent-wrangler/package-lock.json

      - run: npm ci

      # Only the loader's own imports (semver) are needed; nothing is booted.
      - run: npm ci --ignore-scripts
        working-directory: agent-wrangler

      - run: node scripts/validate-manifest.mjs

      - run: npm test

  # The same verification gate as the local hooks (.pre-commit-config.yaml), so
  # a commit made with --no-verify, or from a clone without hooks, still can't
  # reach main unchecked.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # First, so its pre step locks down egress before any other step runs.
      - uses: portswigger-tim/safer-runner-action@d9772c3c7c5c0f8cd6cb7123e138120b11c12371 # v2.2.1
        with:
          mode: analyze
          allowed-domains: |
            registry.npmjs.org
            pypi.org
            files.pythonhosted.org
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: needsyou
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: needsyou/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - run: npm ci --ignore-scripts

      - run: pip install pre-commit==4.7.0

      - run: pre-commit run --all-files --show-diff-on-failure --color=always

  # Boots agent-wrangler main with this checkout copied in as
  # extensions/needsyou, on a throwaway data dir and port, and drives it over
  # the control WS and /mcp as a board tab and an agent would. No session is
  # started and nothing is delivered to a live card. Fails on a quarantine, a
  # missing frame or tool, or any flow that does not land in graph.inbox.
  boot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AW_REPO: ${{ github.workspace }}/agent-wrangler
    steps:
      # First, so its pre step locks down egress before any other step runs.
      - uses: portswigger-tim/safer-runner-action@d9772c3c7c5c0f8cd6cb7123e138120b11c12371 # v2.2.1
        with:
          mode: analyze
          allowed-domains: |
            registry.npmjs.org
          # The wrangler won't boot without tmux, which the runner image lacks,
          # and apt-get needs sudo. Keeping it makes this job ADVISORY: egress
          # is still filtered, but a root step could lift the filter.
          disable-sudo: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: needsyou
          persist-credentials: false

      # Public repo over https: no token or secret is needed or passed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PortSwigger/agent-wrangler
          ref: main
          path: agent-wrangler
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            needsyou/package-lock.json
            agent-wrangler/package-lock.json

      # The copy boot-smoke installs needs this checkout's node_modules (zod).
      - run: npm ci --omit=dev --ignore-scripts

      # No install scripts: the smoke boot opens no terminal, and node-pty
      # ships a linux-x64 prebuild for the import.
      - run: npm ci --ignore-scripts
        working-directory: agent-wrangler

      - run: sudo apt-get update && sudo apt-get install -y tmux

      - run: scripts/boot-smoke.sh
